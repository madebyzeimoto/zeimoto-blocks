# ==========================================================
# Plugins :: zeimoto :: Blocks :: Blueprints :: Blocks :: Text
# ==========================================================

name: field.blocks.text.name
icon: text
preview: text
wysiwyg: true
fields:
  text:
    type: writer
    toolbar:
      inline: false
    marks:
      - bold
      - italic
      - strike
      - "|"
      - link
      - "|"
      - clear
    nodes: false
    placeholder: field.blocks.text.placeholder
  width:
    extends: fields/zeimoto-blocks/width
    width: 3/6
