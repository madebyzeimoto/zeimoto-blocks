# ==========================================================
# Plugins :: zeimoto :: Blocks :: Blueprints :: Blocks :: Video
# ==========================================================

name: field.blocks.video.name
icon: video
preview: video
fields:
  location:
    type: radio
    label: field.blocks.video.location
    columns: 2
    default: "web"
    options:
      kirby: "{{ t('field.blocks.image.location.internal') }}"
      web: "{{ t('field.blocks.image.location.external') }}"
  url:
    type: url
    label: field.blocks.video.url.label
    placeholder: field.blocks.video.url.placeholder
    when:
      location: web
  video:
    type: files
    label: field.blocks.video.name
    query: model.videos
    multiple: false
    when:
      location: kirby
  poster:
    type: files
    label: field.blocks.video.poster
    query: model.images
    multiple: false
    image:
      back: black
    uploads:
      template: blocks/image
    when:
      location: kirby
  caption:
    type: writer
    label: field.blocks.video.caption
    inline: true
  autoplay:
    type: toggle
    label: field.blocks.video.autoplay
    width: 1/3
    when:
      location: kirby
  muted:
    type: toggle
    label: field.blocks.video.muted
    width: 1/3
    default: true
    when:
      location: kirby
  loop:
    type: toggle
    label: field.blocks.video.loop
    width: 1/3
    when:
      location: kirby
  controls:
    type: toggle
    label: field.blocks.video.controls
    width: 1/3
    default: true
    when:
      location: kirby
  preload:
    type: select
    label: field.blocks.video.preload
    width: 2/3
    default: auto
    options:
      - auto
      - metadata
      - none
    when:
      location: kirby
  mediaWidth:
    type: number
    label: Video width
    min: 1
    default: 1600
    width: 1/2
    when:
      location: web
  mediaHeight:
    type: number
    label: Video height
    min: 1
    default: 900
    width: 1/2
    when:
      location: web
  width:
    extends: fields/zeimoto-blocks/width
    width: 3/6
