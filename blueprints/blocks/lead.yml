# ==========================================================
# Plugins :: zeimoto :: Blocks :: Blueprints :: Blocks :: Lead
# ==========================================================

name: Lead
icon: megaphone
preview: lead
wysiwyg: true
fields:
  text:
    type: zeimoto-writer
    label:
      "*": zeimoto-blocks.blocks.lead.text
    placeholder: field.blocks.text.placeholder
    toolbar:
      inline: false
    marks:
      - bold
      - italic
      - strike
      - "|"
      - link
      - "|"
      - clear
  cta:
    type: pagepicker
    label:
      "*": zeimoto-blocks.blocks.lead.cta
    translate: false
    multiple: false
    query: site.children.listed
    width: 3/6
  ctaLabel:
    type: text
    label:
      "*": zeimoto-blocks.blocks.lead.cta-label
    placeholder:
      "*": zeimoto-blocks.blocks.lead.cta-label-placeholder
    width: 3/6
  width:
    extends: fields/zeimoto-blocks/width
    width: 3/6
